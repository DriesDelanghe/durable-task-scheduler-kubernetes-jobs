{{- if .Values.dtsEmulator.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "durable-task-scheduler.fullname" . }}-dts-emulator
  labels:
    {{- include "durable-task-scheduler.labels" . | nindent 4 }}
    component: dts-emulator
spec:
  type: {{ .Values.dtsEmulator.service.type }}
  ports:
    - port: {{ .Values.dtsEmulator.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.dtsEmulator.service.dashboardPort }}
      targetPort: dashboard
      protocol: TCP
      name: dashboard
  selector:
    {{- include "durable-task-scheduler.selectorLabels" . | nindent 4 }}
    component: dts-emulator
{{- end }}

