apiVersion: v1
kind: Service
metadata:
  name: {{ include "durable-task-scheduler.fullname" . }}-k8s-controller
  labels:
    {{- include "durable-task-scheduler.labels" . | nindent 4 }}
    component: k8s-controller
spec:
  type: {{ .Values.k8sController.service.type }}
  ports:
    - port: {{ .Values.k8sController.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "durable-task-scheduler.selectorLabels" . | nindent 4 }}
    component: k8s-controller

