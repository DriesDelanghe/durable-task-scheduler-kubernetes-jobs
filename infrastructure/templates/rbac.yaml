apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "durable-task-scheduler.fullname" . }}-role
  labels:
    {{- include "durable-task-scheduler.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/status"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "durable-task-scheduler.fullname" . }}-rolebinding
  labels:
    {{- include "durable-task-scheduler.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "durable-task-scheduler.fullname" . }}-role
subjects:
- kind: ServiceAccount
  name: {{ include "durable-task-scheduler.fullname" . }}-sa
  namespace: {{ .Release.Namespace }}

