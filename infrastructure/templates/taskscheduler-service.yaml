apiVersion: v1
kind: Service
metadata:
  name: {{ include "durable-task-scheduler.fullname" . }}-task-scheduler
  labels:
    {{- include "durable-task-scheduler.labels" . | nindent 4 }}
    component: task-scheduler
spec:
  type: {{ .Values.taskScheduler.service.type }}
  ports:
    - port: {{ .Values.taskScheduler.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "durable-task-scheduler.selectorLabels" . | nindent 4 }}
    component: task-scheduler

